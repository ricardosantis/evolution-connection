version: "3.7"

services:
  evo-client:
    image: ricardosantis/evolution-connection:latest
    container_name: evo-client
    restart: unless-stopped
    networks:
      - hostinger
    environment:
      - CONNECTION_API_URL=your-site-url-here
      - CONNECTION_API_KEY=your-api-key-here
    volumes:
      - evo_client:/usr/share/nginx/html
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=1
        - traefik.http.routers.evo-client.rule=Host(`sub-domain.site-url.com.br`)
        - traefik.http.routers.evo-client.entrypoints=websecure
        - traefik.http.routers.evo-client.priority=1
        - traefik.http.routers.evo-client.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evo-client.service=evo-client
        - traefik.http.services.evo-client.loadbalancer.server.port=80
        - traefik.http.services.evo-client.loadbalancer.passHostHeader=true

volumes:
  evo_client:
    external: true
    name: evo_client

networks:
  hostinger:
    external: true
    name: hostinger
